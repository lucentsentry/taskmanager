<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Task Manager</title><link rel="stylesheet" href="/css/style.css"></head><body><h1>My Task List</h1><a href="/addTask">Add Task</a><table border="1"><tr><th>ID</th><th>Title</th><th>Description</th><th>Due date</th><th>Status</th><th>Actions</th></tr><tr th:each="task : ${tasks}"><td th:text="${task.id}"></td><td th:text="${task.title}"></td><td th:text="${task.description}"></td><td th:text="${task.dueDate}"></td><td th:text="${task.completed} ? 'Completed' : 'Not completed'"></td><td><a th:href="@{/editTask/{id}(id=${task.id})}">Edit</a><form onsubmit="return confirm('Delete this task?')" method="post" th:action="@{/deleteTask/{id}(id=${task.id})}"><button>Delete</button></form></td></tr></table></body></html>
